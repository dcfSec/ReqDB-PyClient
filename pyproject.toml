[project]
name = "reqdb"
version = "0.12.1"
description = "Python API client for ReqDB"
readme = "README.md"
authors = [{ name = "dcfSec", email = "contributor@dcfsec.com" }]
requires-python = ">=3.10,<4.0"
dependencies = [
    "requests>=2.32.2,<3.0.0",
    "pydantic>=2.11.4,<3.0.0",
    "authlib>=1.4.0,<2.0.0",
    "joserfc>=1.3.4,<2.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
